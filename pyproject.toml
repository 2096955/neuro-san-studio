[build-system]
requires = ["setuptools>=77.0", "wheel", "setuptools-scm==8.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-san-studio"
dynamic = ["version", "dependencies", "optional-dependencies", "readme"]
description = "Multi-agent orchestration studio built on the neuro-san framework."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [{ name = "Cognizant AI Lab" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
neuro-san-studio = "neuro_san_studio.commands.cli:main"
ns = "neuro_san_studio.commands.cli:main"

[project.urls]
Homepage = "https://github.com/cognizant-ai-lab/neuro-san-studio"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-build.txt"] }
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools.packages.find]
where = ["."]
include = ["neuro_san_studio*", "registries*", "coded_tools*", "middleware*", "skills*"]
exclude = ["apps*", "build_scripts*", "config*", "deploy*", "docs*", "servers*", "tests*"]

[tool.setuptools.package-data]
"neuro_san_studio.templates" = ["*.hocon"]
"neuro_san_studio.mcp" = ["*.hocon"]
"neuro_san_studio.toolbox" = ["*.hocon"]
"registries" = ["**/*.hocon"]
"coded_tools" = ["**/*.py"]
"middleware" = ["**/*.py"]
"skills" = ["**/*.md", "**/*.py"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.isort]
profile = "black"
src_paths = ["apps", "coded_tools", "neuro_san_studio", "tests"]
line_length = 119
known_first_party = ["apps", "coded_tools", "neuro_san_studio"]

[tool.flake8]
extend-ignore = ["W503", "E203"]
max-line-length = 119

[tool.black]
line-length = 119
required-version = "25.1.0"

[tool.ruff]
target-version = "py312"
line-length = 119
src = ["apps", "coded_tools", "neuro_san_studio", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["apps", "coded_tools", "neuro_san_studio", "tests"]

[tool.pylint]
max-line-length = 119
disable = [
    "C0301",
    "C0114",
    "R0801",
    "W0511",
]
good-names = ["i", "j", "k", "ex", "_", "id", "f", "db", "e"]
ignore-patterns = [".*checkpoint\\.py"]
ignore-paths = ["^venv/.*$", "^.*/\\.venv/.*$"]
enable = ["useless-suppression"]
const-naming-style = "UPPER_CASE"
function-naming-style = "snake_case"
class-naming-style = "PascalCase"
method-naming-style = "snake_case"
attr-naming-style = "snake_case"
argument-naming-style = "snake_case"
variable-naming-style = "snake_case"
inlinevar-naming-style = "snake_case"
fail-under = 10.0
output-format = "colorized"
init-import = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --cov=. --cov-report=term-missing --no-cov-on-fail"

[tool.coverage.run]
omit = ["tests/*", "*/venv/*"]
