<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro AI - Multi Agent Accelerator Client</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            height: 100vh;
            overflow: hidden;
        }

        .top-nav {
            background: #ffffff;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .top-nav .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #3b82f6;
        }

        .main-layout {
            display: flex;
            height: calc(100vh - 60px);
        }

        .sidebar-left {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .sidebar-header h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .network-selector {
            margin-top: 10px;
        }

        .network-selector label {
            font-size: 0.9rem;
            color: #64748b;
            display: block;
            margin-bottom: 5px;
        }

        .network-selector select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #ffffff;
            color: #1e293b;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .network-selector select:hover {
            border-color: #2563eb;
        }

        .network-selector select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .agent-networks {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .agent-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .agent-card:hover {
            background: #e0f2fe;
            border-color: #38bdf8;
        }

        .agent-card.active {
            background: #e0f2fe;
            border-color: #0ea5e9;
        }

        .agent-status {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        .agent-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .agent-type {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 8px;
        }

        .agent-model {
            font-size: 0.75rem;
            color: #475569;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        .network-center {
            flex: 1;
            background: #f8fafc;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .network-header {
            background: #ffffff;
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .network-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .network-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: #e2e8f0;
            border: none;
            color: #1e293b;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #cbd5e1;
        }

        .network-canvas {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 600px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        
        .network-canvas svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .sidebar-right {
            width: 320px;
            background: #ffffff;
            border-left: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .chat-header {
            background: #f8fafc;
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .chat-status {
            font-size: 0.8rem;
            color: #10b981;
        }

        .chat-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .system-status {
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .status-label {
            color: #64748b;
        }

        .status-value {
            color: #10b981;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px;
            min-height: 0;
            max-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .message.agent {
            background: #f8fafc;
            border-left: 3px solid #38bdf8;
        }

        .message.user {
            background: #dbeafe;
            border-left: 3px solid #0ea5e9;
        }

        .message.system {
            background: #ecfdf5;
            border-left: 3px solid #10b981;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .message-agent {
            font-weight: 600;
            color: #0ea5e9;
        }

        .message-time {
            font-size: 0.75rem;
            color: #64748b;
        }

        .message-content {
            color: #1e293b;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .chat-input {
            border-top: 1px solid #e2e8f0;
            padding: 15px;
            flex-shrink: 0;
            background: #ffffff;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .chat-input input:focus {
            outline: none;
            border-color: #0ea5e9;
        }

        .send-btn {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: #2563eb;
        }

        /* Network visualization styles */
        .node {
            cursor: pointer;
        }

        .node circle {
            stroke: #0ea5e9;
            stroke-width: 2px;
        }

        .node text {
            font-size: 10px;
            font-weight: 500;
            text-anchor: middle;
            fill: #1e293b;
            pointer-events: none;
        }

        .link {
            stroke: #1e293b;
            stroke-width: 2px;
            stroke-opacity: 0.6;
        }

        .link.active {
            stroke: #10b981;
            stroke-width: 3px;
            stroke-opacity: 1;
            animation: pulse-link 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes pulse-link {
            0% { stroke-opacity: 0.6; }
            50% { stroke-opacity: 1; }
            100% { stroke-opacity: 0.6; }
        }

        .tooltip {
            position: absolute;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 1000;
            display: none;
            color: #1e293b;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            color: #475569;
            z-index: 10;
        }

        .loading i {
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <div class="top-nav">
        <div class="logo">
            <i class="fas fa-brain"></i>
            Neuro AI - Multi Agent Accelerator Client
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="handleDeploy()">Deploy</button>
            <button class="nav-btn" onclick="handleAnalytics()">Analytics</button>
            <button class="nav-btn" onclick="handleExplicate()">Explicate</button>
            <button class="nav-btn" onclick="handleExpert()">Expert</button>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Left Sidebar - Agent Networks -->
        <div class="sidebar-left">
            <div class="sidebar-header">
                <h3>Agent Networks</h3>
                <div class="network-selector">
                    <label for="network-type">Industry Vertical</label>
                    <select id="network-type" onchange="switchNetwork()">
                        <option value="insurance">Insurance Underwriting</option>
                        <option value="banking">Banking Operations</option>
                        <option value="automotive" selected>Automotive Manufacturing</option>
                        <option value="rhea">Healthcare — RHEA MCDI</option>
                    </select>
                </div>
                <div style="font-size: 0.8rem; color: #6b7280; margin-top: 10px;">
                    <i class="fas fa-circle" style="color: #10b981; font-size: 6px;"></i>
                    <span id="agent-count-status">0 active agents</span>
                </div>
            </div>
            <div class="agent-networks" id="agent-list">
                <!-- Agent cards will be populated here -->
            </div>
        </div>

        <!-- Center - Network Visualization -->
        <div class="network-center">
            <div class="network-header">
                <div class="network-title">Multi-Agent Network Topology</div>
                <div class="network-controls">
                    <button class="control-btn" onclick="resetNetwork()">Reset</button>
                    <button class="control-btn" onclick="exportNetwork()">Export</button>
                    <button class="control-btn" onclick="showSettings()">Settings</button>
                </div>
            </div>
            <div class="network-canvas" id="network-canvas">
                <div class="loading" id="network-loading">
                    <i class="fas fa-spinner"></i>
                    Loading agent network...
                </div>
            </div>
        </div>

        <!-- Right Sidebar - Chat Interface -->
        <div class="sidebar-right">
            <div class="chat-header">
                <div class="chat-title">Chat</div>
                <div class="chat-status">
                    <i class="fas fa-circle" style="color: #10b981; font-size: 6px;"></i>
                    Online
                </div>
            </div>
            <div class="chat-content">
                <div class="system-status">
                    <div class="status-row">
                        <span class="status-label">System</span>
                        <span class="status-value" id="connected-agent">No agent selected</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Agents</span>
                        <span class="status-value" id="agent-count-value">0 active</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Model</span>
                        <span class="status-value">AWS Bedrock Claude Sonnet 4</span>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <!-- Messages will be populated here -->
                </div>
                <div class="chat-input">
                    <div class="input-row">
                        <input type="text" id="message-input" placeholder="Type a message..." />
                        <button class="send-btn" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip"></div>

    <script>
        // Global variables
        // Test JavaScript execution
        console.log('=== JAVASCRIPT LOADING TEST ===');
        console.log('Script block executing...');
        
        let networkTopology = null;
        let simulation = null;
        let svg = null;
        let socket = null;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM content loaded - starting initialization');
            try {
                initializeSocket();
                console.log('Socket initialized, loading topology...');
                loadNetworkTopology();
                initializeChat();
                console.log('Initialization complete');
            } catch (error) {
                console.error('Error during initialization:', error);
            }
        });

        // Socket.IO initialization
        function initializeSocket() {
            socket = io();
            
            socket.on('connect', function() {
                console.log('Connected to server');
                addChatMessage('system', 'System', 'Connected to agent network');
            });

            socket.on('agent_message', function(data) {
                addChatMessage('agent', data.agent, data.message);
                highlightAgentActivity(data.agent);
            });

            socket.on('topology_update', function(data) {
                console.log('Topology updated:', data);
                networkTopology = data;
                renderNetwork();
            });
        }

        // Switch between different industry networks
        async function switchNetwork() {
            const selector = document.getElementById('network-type');
            const selectedNetwork = selector.value;
            
            console.log('Switching to network:', selectedNetwork);
            
            // Clear current visualization
            const canvas = document.getElementById('network-canvas');
            canvas.innerHTML = '<div class="loading" id="network-loading"><i class="fas fa-spinner"></i>Loading agent network...</div>';
            
            // Clear chat and reset state
            chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML = '';
            selectedAgent = null;
            selectedAgentForChat = null;  // Reset chat routing
            currentSessionId = null;
            conversationContext = {};  // Reset conversation context
            chatHistories = {};
            
            // Reload topology for selected network
            await loadNetworkTopology(selectedNetwork);
            
            const networkNames = {
                'insurance': 'Insurance Underwriting',
                'banking': 'Banking Operations',
                'automotive': 'Automotive Manufacturing',
                'rhea': 'RHEA MCDI Clinical Decision Support'
            };
            addChatMessage('system', 'System', `Switched to ${networkNames[selectedNetwork] || selectedNetwork} network`);
        }

        // Load network topology from server
        async function loadNetworkTopology(networkType = 'automotive') {
            try {
                console.log('Loading network topology for:', networkType);
                const response = await fetch(`/api/topology?network=${networkType}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Raw API response:', data);
                
                // Handle both wrapped and direct topology responses
                if (data.status === 'success' && data.topology) {
                    networkTopology = data.topology;
                } else if (data.nodes && data.connections) {
                    // Direct topology response (which is what we're getting)
                    networkTopology = data;
                } else {
                    throw new Error('Invalid topology response format');
                }
                
                console.log('Network topology loaded:', networkTopology);
                
                // Hide loading overlay
                const loadingEl = document.getElementById('network-loading');
                if (loadingEl) {
                    loadingEl.style.display = 'none';
                }
                
                populateAgentList();
                updateUIFromTopology();
                renderNetwork();
            } catch (error) {
                console.error('Error loading topology:', error);
                addChatMessage('system', 'System', 'Error loading agent network: ' + error.message);
            }
        }

        // Populate agent list in left sidebar
        function populateAgentList() {
            const agentList = document.getElementById('agent-list');
            agentList.innerHTML = '';

            networkTopology.nodes.forEach(agent => {
                const agentCard = document.createElement('div');
                agentCard.className = 'agent-card';
                agentCard.dataset.agentId = agent.id;
                agentCard.style.cursor = 'pointer';
                agentCard.innerHTML = `
                    <div class="agent-status">●</div>
                    <div class="agent-name">${agent.label}</div>
                    <div class="agent-type">${agent.type}</div>
                    <div class="agent-model">${agent.model}</div>
                `;
                
                // Make cards clickable to select agent for chat
                agentCard.addEventListener('click', () => selectAgentForChat(agent.id, agent.label));
                agentList.appendChild(agentCard);
            });
        }

        // Render network visualization
        function renderNetwork() {
            if (!networkTopology) return;

            const container = document.getElementById('network-canvas');
            const width = container.clientWidth || 800;
            const height = container.clientHeight || 600;
            
            console.log('Container dimensions:', width, 'x', height);
            
            if (width === 0 || height === 0) {
                console.warn('Container has no dimensions, retrying in 100ms');
                setTimeout(renderNetwork, 100);
                return;
            }

            // Clear existing SVG
            d3.select('#network-canvas svg').remove();

            // Create SVG
            svg = d3.select('#network-canvas')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            // Add arrow marker
            svg.append('defs').append('marker')
                .attr('id', 'arrowhead')
                .attr('viewBox', '0 -5 10 10')
                .attr('refX', 65)
                .attr('refY', 0)
                .attr('markerWidth', 6)
                .attr('markerHeight', 6)
                .attr('orient', 'auto')
                .append('path')
                .attr('d', 'M0,-5L10,0L0,5')
                .attr('fill', '#4f46e5');

            // Define zones for organizing agents (vertical layout)
            const zones = {
                'front_office': { 
                    y: height * 0.15,           // Top section
                    color: '#8B5CF6',           // Purple
                    bgColor: '#f3e8ff',         // Light purple background
                    label: 'Front Office (Customer)'
                },
                'middle_office': { 
                    y: height * 0.50,           // Middle section
                    color: '#3B82F6',           // Blue
                    bgColor: '#dbeafe',         // Light blue background
                    label: 'Middle Office (Coordination)'
                },
                'back_office': { 
                    y: height * 0.80,           // Bottom section
                    color: '#14B8A6',           // Teal
                    bgColor: '#ccfbf1',         // Light teal background
                    label: 'Back Office (Processing)'
                }
            };

            // Assign zones to agents based on their role
            function getAgentZone(agentId) {
                // INSURANCE NETWORK ZONES
                // Front Office: Customer-facing agents
                if (['insurance_agent', 'insurance_broker_agent'].includes(agentId)) {
                    return 'front_office';
                }
                // Middle Office: Domain coordinators
                if (['underwriting_decision_agent', 'claims_processing_agent'].includes(agentId)) {
                    return 'middle_office';
                }
                
                // BANKING NETWORK ZONES
                // Front Office: Customer-facing agents
                if (['customer_service_representative', 'relationship_manager', 'trading_desk', 
                     'business_banking_officer', 'wealth_management_advisor'].includes(agentId)) {
                    return 'front_office';
                }
                // Middle Office: Coordination and risk assessment
                if (['account_manager', 'loan_officer', 'portfolio_manager', 'underwriter'].includes(agentId)) {
                    return 'middle_office';
                }
                // Back Office: Processing, security, and specialists
                if (['fraud_prevention_specialist', 'fraud_investigation_team', 'security_analyst',
                     'investment_specialist', 'mortgage_specialist'].includes(agentId)) {
                    return 'back_office';
                }
                
                // AUTOMOTIVE NETWORK ZONES (Reorganized)
                // Front Office: Customer-facing agents (Purple)
                if (['customer_service_agent', 'dealership_support_agent', 'service_scheduling_specialist', 
                     'recall_information_agent', 'warranty_claims_processor'].includes(agentId)) {
                    return 'front_office';
                }
                // Middle Office: Coordination and quality (Blue, except Operations Coordinator)
                if (['automotive_operations_coordinator', 'quality_control_agent', 'factory_efficiency_optimizer',
                     'production_planning_specialist', 'technical_service_advisor'].includes(agentId)) {
                    return 'middle_office';
                }
                // Back Office: Processing, supply chain, manufacturing (Teal)
                if (['manufacturing_operations_agent', 'supply_chain_management_agent', 'logistics_coordinator',
                     'engineering_support_agent', 'supplier_relations_agent', 'parts_inventory_specialist'].includes(agentId)) {
                    return 'back_office';
                }
                
                // RHEA MCDI NETWORK ZONES
                // Front Office: HCP-facing
                if (['cds_coordinator', 'hcp_priority_capture'].includes(agentId)) {
                    return 'front_office';
                }
                // Middle Office: coordination + core engine
                if (['evidence_validator', 'strategy_optimizer', 'multi_objective_engine',
                     'governance_layer', 'learning_loop'].includes(agentId)) {
                    return 'middle_office';
                }
                // Back Office: processing / specialists
                if (['patient_context', 'outcome_projector', 'tradeoff_explainer',
                     'safety_checker', 'audit_logger'].includes(agentId)) {
                    return 'back_office';
                }

                // Default: Back Office for all other specialists
                return 'back_office';
            }

            // Prepare data - fix API data mapping
            const nodes = networkTopology.nodes.map(d => {
                const node = Object.assign({}, d);
                node.zone = getAgentZone(d.id);
                node.targetY = zones[node.zone].y;
                node.zoneColor = zones[node.zone].color;
                // Special handling for Operations Coordinator
                node.isHub = d.id === 'automotive_operations_coordinator';
                return node;
            });
            
            const links = networkTopology.connections.map(d => Object.assign({
                source: d.from,
                target: d.to,
                type: d.type
            }, d));

            // Draw zone backgrounds (vertical sections)
            const zoneBackgrounds = [
                { zone: 'front_office', y: 0, height: height * 0.3 },
                { zone: 'middle_office', y: height * 0.3, height: height * 0.4 },
                { zone: 'back_office', y: height * 0.7, height: height * 0.3 }
            ];

            svg.append('g')
                .selectAll('rect')
                .data(zoneBackgrounds)
                .enter()
                .append('rect')
                .attr('x', 0)
                .attr('y', d => d.y)
                .attr('width', width)
                .attr('height', d => d.height)
                .style('fill', d => zones[d.zone].bgColor)
                .style('opacity', 0.3);

            // Draw zone labels (vertical layout on left side)
            svg.append('g')
                .selectAll('text')
                .data(Object.keys(zones))
                .enter()
                .append('text')
                .attr('x', 15)
                .attr('y', d => zones[d].y)
                .attr('text-anchor', 'start')
                .style('fill', d => zones[d].color)
                .style('font-size', '13px')
                .style('font-weight', 'bold')
                .text(d => zones[d].label);

            // Create simulation with vertical zone positioning
            simulation = d3.forceSimulation(nodes)
                .force('charge', d3.forceManyBody().strength(-300))
                .force('x', d3.forceX(width / 2).strength(0.1))
                .force('y', d3.forceY(d => d.targetY).strength(0.9))
                .force('collision', d3.forceCollide().radius(85));
            
            // Add links with validation
            try {
                console.log('Setting up force links with nodes:', nodes.map(n => n.id));
                console.log('Setting up force links with links:', links);
                
                simulation.force('link', d3.forceLink(links)
                    .id(d => {
                        console.log('ID accessor for:', d);
                        return d.id;
                    })
                    .distance(120));
                    
                console.log('Force links set up successfully');
            } catch (error) {
                console.error('Error setting up force links:', error);
                // Continue without links if there's an error
            }

            // Create links
            const link = svg.append('g')
                .selectAll('line')
                .data(links)
                .enter().append('line')
                .attr('class', 'link')
                .attr('marker-end', 'url(#arrowhead)');

            // Create nodes
            const node = svg.append('g')
                .selectAll('g')
                .data(nodes)
                .enter().append('g')
                .attr('class', 'node')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));

            // Add rounded rectangles to nodes
            node.append('rect')
                .attr('width', d => d.isHub ? 200 : 160)  // Larger for Operations Coordinator
                .attr('height', d => d.isHub ? 60 : 50)
                .attr('x', d => d.isHub ? -100 : -80)
                .attr('y', d => d.isHub ? -30 : -25)
                .attr('rx', 8)
                .attr('ry', 8)
                .style('fill', d => d.isHub ? '#F59E0B' : d.zoneColor)  // Orange for hub, zone color otherwise
                .style('stroke', d => d.isHub ? '#D97706' : '#0ea5e9')
                .style('stroke-width', d => d.isHub ? 3 : 2);

            // Add labels to nodes
            node.append('text')
                .text(d => d.label)
                .style('font-size', d => d.isHub ? '13px' : '11px')  // Larger font for hub
                .style('font-weight', d => d.isHub ? 'bold' : '600')
                .style('text-anchor', 'middle')
                .style('fill', 'white')
                .attr('dy', '0.35em')
                .each(function(d) {
                    // Wrap text if too long
                    const text = d3.select(this);
                    const words = d.label.split(' ');
                    if (words.length > 2) {
                        text.text('');
                        text.append('tspan')
                            .attr('x', 0)
                            .attr('dy', '-0.3em')
                            .text(words.slice(0, Math.ceil(words.length/2)).join(' '));
                        text.append('tspan')
                            .attr('x', 0)
                            .attr('dy', '1.2em')
                            .text(words.slice(Math.ceil(words.length/2)).join(' '));
                    }
                });

            // Add status indicators
            node.append('circle')
                .attr('r', 4)
                .attr('cx', d => d.isHub ? 90 : 70)
                .attr('cy', d => d.isHub ? -25 : -20)
                .style('fill', '#10b981')
                .attr('class', 'status-indicator');

            // Add tooltips and click handlers
            node.on('mouseover', function(event, d) {
                showTooltip(event, d);
            })
            .on('mouseout', function() {
                hideTooltip();
            })
            .on('click', function(event, d) {
                selectAgent(d.id);
            });

            // Update positions on simulation tick
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node
                    .attr('transform', d => `translate(${d.x},${d.y})`);
            });
        }

        // ENHANCED extraction function for structured data and brand detection
        function extractUserDetails(message) {
            const extracted = {};
            
            // ===== 1. STRUCTURED FORMAT (✓ checkmarks) =====
            const structuredPatterns = {
                name: /✓\s*name\s*:\s*["']?([^"'\n]+?)["']?(?:\s|$)/i,
                email: /✓\s*email\s*:\s*["']?([^"'\n]+?)["']?(?:\s|$)/i,
                phone: /✓\s*phone\s*:\s*["']?([^"'\n]+?)["']?(?:\s|$)/i,
                rego: /✓\s*rego\s*:\s*["']?([^"'\n]+?)["']?(?:\s|$)/i,
                registration: /✓\s*registration\s*:\s*["']?([^"'\n]+?)["']?(?:\s|$)/i,
                vehicle: /✓\s*vehicle\s*:\s*["']?([^"'\n]+?)["']?(?:\s|$)/i,
                model: /✓\s*model\s*:\s*["']?([^"'\n]+?)["']?(?:\s|$)/i
            };
            
            Object.keys(structuredPatterns).forEach(key => {
                const match = message.match(structuredPatterns[key]);
                if (match && match[1]) {
                    extracted[key] = match[1].trim().replace(/["']$/g, '').replace(/^["']/g, '');
                }
            });
            
            // ===== 2. NATURAL LANGUAGE EXTRACTION =====
            
            // Name extraction (multiple patterns)
            if (!extracted.name) {
                const namePatterns = [
                    /(?:name is|my name is|i'm|i am|call me)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)/i,
                    /([A-Z][a-z]+\s+[A-Z][a-z]+)\s+(?:is the name|is my name)/i
                ];
                for (const pattern of namePatterns) {
                    const match = message.match(pattern);
                    if (match && match[1]) {
                        extracted.name = match[1].trim();
                        break;
                    }
                }
            }
            
            // Email extraction
            if (!extracted.email) {
                const emailMatch = message.match(/[\w.-]+@[\w.-]+\.\w+/);
                if (emailMatch && !emailMatch[0].includes('example')) {
                    extracted.email = emailMatch[0].trim();
                }
            }
            
            // Phone extraction (UK and Australian formats)
            if (!extracted.phone) {
                const phonePatterns = [
                    // UK formats
                    /07\d{2}\s?\d{3}\s?\d{3}\s?\d{3}/,  // UK mobile: 07123 456789
                    /\+44\s*7\d{2}\s?\d{3}\s?\d{3}\s?\d{3}/,  // +44 7123 456789
                    /\+44\s*7\d{9}/,  // +447123456789
                    /0\d{2,3}\s?\d{3,4}\s?\d{3,4}/,  // UK landline: 020 1234 5678
                    /\(0\d{2,3}\)\s?\d{3,4}\s?\d{3,4}/,  // (020) 1234 5678
                    // Australian formats
                    /04\d{2}\s?\d{3}\s?\d{3}/,  // Australian mobile: 0412 345 678
                    /\+614\d{8}/,  // +61412345678
                    /0\d{9}/  // General 10-digit number
                ];
                
                for (const pattern of phonePatterns) {
                    const match = message.match(pattern);
                    if (match) {
                        let phone = match[0].replace(/[\s()-]/g, '');
                        if (phone.startsWith('44') && !phone.startsWith('+44')) {
                            phone = '+' + phone;
                        }
                        extracted.phone = phone;
                        break;
                    }
                }
            }
            
            // Registration/Rego extraction
            if (!extracted.rego && !extracted.registration) {
                const regoPatterns = [
                    /(?:rego|registration|reg)\s*(?:is|:|=)\s*["']?([A-Z0-9]{5,8})["']?/i,
                    /\b([A-Z]{2}\d{2}[A-Z]{3})\b/,  // GD23JSV format
                    /([A-Z0-9]{6,7})\s+is the rego/i
                ];
                
                for (const pattern of regoPatterns) {
                    const match = message.match(pattern);
                    if (match && match[1]) {
                        const rego = match[1].toUpperCase().replace(/\s+/g, '');
                        if (rego.length >= 5 && rego.length <= 8 && /[A-Z]/.test(rego) && /\d/.test(rego)) {
                            extracted.rego = rego;
                            break;
                        }
                    }
                }
            }
            
            // Vehicle model extraction
            if (!extracted.model && !extracted.vehicle) {
                const vwModels = ['Tiguan', 'Golf', 'ID.4', 'ID.3', 'Passat', 'Polo', 'Amarok', 'T-Roc', 'Arteon', 'Touareg'];
                const fordModels = ['Mustang', 'F-150', 'Ranger', 'Explorer', 'Focus', 'Fiesta', 'Edge', 'Bronco'];
                const bmwModels = ['3 Series', '5 Series', '7 Series', 'X1', 'X3', 'X5', 'X7', 'M3', 'M5'];
                const allModels = [...vwModels, ...fordModels, ...bmwModels];
                
                for (const model of allModels) {
                    const regex = new RegExp(`\\b${model.replace('.', '\\.')}\\b`, 'i');
                    if (regex.test(message)) {
                        extracted.model = model;
                        break;
                    }
                }
            }
            
            // Clean up extracted data
            if (extracted.name) {
                extracted.name = extracted.name.replace(/^["']+|["']+$/g, '').trim();
                extracted.name = extracted.name.split(' ').map(word => 
                    word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
                ).join(' ');
            }
            
            if (extracted.email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(extracted.email)) {
                    delete extracted.email;
                }
            }
            
            return extracted;
        }
        
        // Brand detection function
        function detectBrand(message, context = {}) {
            const lowerMessage = message.toLowerCase();
            
            // Check if brand already detected in context
            if (context.brand) return context.brand;
            
            // VWI/Volkswagen indicators
            const vwiKeywords = ['vw', 'volkswagen', 'vwi', 'tiguan', 'golf', 'passat', 'arteon', 
                                 'polo', 'id.4', 'id.3', 'id4', 'id3', 'touareg', 't-roc', 'amarok'];
            
            // Ford indicators
            const fordKeywords = ['ford', 'mustang', 'f-150', 'f150', 'ranger', 'explorer', 
                                  'focus', 'fiesta', 'edge', 'bronco'];
            
            // BMW indicators
            const bmwKeywords = ['bmw', '3 series', '5 series', '7 series', 'x1', 'x3', 'x5', 
                                 'x7', 'm3', 'm5'];
            
            if (vwiKeywords.some(keyword => lowerMessage.includes(keyword))) {
                return 'VWI';
            }
            
            if (fordKeywords.some(keyword => lowerMessage.includes(keyword))) {
                return 'FORD';
            }
            
            if (bmwKeywords.some(keyword => lowerMessage.includes(keyword))) {
                return 'BMW';
            }
            
            // Default to VWI (based on current setup)
            return 'VWI';
        }

        function addChatMessage(type, agent, message, messageId = null) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            if (messageId) {
                messageDiv.id = messageId;
            }
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span class="message-agent">${agent}</span>
                    <span class="message-time">${timeStr}</span>
                </div>
                <div class="message-content">${message}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Track selected agent for chat and maintain separate chat histories
        let selectedAgentForChat = 'automotive_operations_coordinator';
        let chatHistories = {}; // Store chat history per agent
        
        // Save current chat history before switching agents
        function saveChatHistory() {
            const chatMessages = document.getElementById('chat-messages');
            chatHistories[selectedAgentForChat] = chatMessages.innerHTML;
        }
        
        // Load chat history for selected agent
        function loadChatHistory(agentId) {
            const chatMessages = document.getElementById('chat-messages');
            if (chatHistories[agentId]) {
                chatMessages.innerHTML = chatHistories[agentId];
            } else {
                // Start fresh chat for this agent
                chatMessages.innerHTML = '';
                const agent = networkTopology.nodes.find(n => n.id === agentId);
                const agentName = agent ? agent.label : agentId;
                addChatMessage('system', 'System', `Connected to ${agentName}. How can I help you today?`);
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (message) {
                // Extract user details from message (handles ✓ checkmarks and natural language)
                const extractedDetails = extractUserDetails(message);
                
                // Detect brand from message and context
                const detectedBrand = detectBrand(message, conversationContext);
                
                // Update conversation context with extracted details and brand
                conversationContext = { 
                    ...conversationContext, 
                    ...extractedDetails,
                    brand: detectedBrand
                };
                
                // Log extracted context
                if (Object.keys(extractedDetails).length > 0) {
                    console.log('Extracted user details:', extractedDetails);
                    console.log('Detected brand:', detectedBrand);
                    console.log('Updated context:', conversationContext);
                }
                
                addChatMessage('user', 'You', message);
                input.value = '';
                
                // Show typing indicator
                const typingId = `typing-${Date.now()}`;
                addChatMessage('agent', 'Agent', '● ● ● Thinking...', typingId);
                
                // Create or maintain session ID
                if (!currentSessionId) {
                    currentSessionId = `session_${Date.now()}`;
                }
                
                // Build BRAND-AWARE system override to prevent cross-contamination
                let systemOverride = '';
                
                // Add brand context (CRITICAL: prevents mentioning wrong brands)
                const brandName = detectedBrand === 'VWI' ? 'Volkswagen (VW)' : 
                                  detectedBrand === 'FORD' ? 'Ford' : 'BMW';
                systemOverride += `You are a ${brandName} customer service agent. `;
                
                if (detectedBrand === 'VWI') {
                    systemOverride += `You specialize in Volkswagen vehicles including Tiguan, Golf, ID.4, Passat, and other VW models. `;
                    systemOverride += `IMPORTANT: Never mention Ford or BMW brands. Only discuss Volkswagen products and services. `;
                } else if (detectedBrand === 'FORD') {
                    systemOverride += `You specialize in Ford vehicles including Mustang, F-150, Ranger, and other Ford models. `;
                    systemOverride += `IMPORTANT: Never mention Volkswagen or BMW brands. Only discuss Ford products and services. `;
                } else if (detectedBrand === 'BMW') {
                    systemOverride += `You specialize in BMW vehicles including 3 Series, 5 Series, X Series, and other BMW models. `;
                    systemOverride += `IMPORTANT: Never mention Volkswagen or Ford brands. Only discuss BMW products and services. `;
                }
                
                systemOverride += `Be warm and welcoming. Greet users positively and handle all appropriate customer service requests including simple greetings.`;
                
                // Build enriched message with customer information
                let enrichedMessage = message;
                
                if (Object.keys(conversationContext).length > 1) { // More than just 'brand'
                    let contextInfo = "Customer information: ";
                    if (conversationContext.name) contextInfo += `Name: ${conversationContext.name}. `;
                    if (conversationContext.email) contextInfo += `Email: ${conversationContext.email}. `;
                    if (conversationContext.phone) contextInfo += `Phone: ${conversationContext.phone}. `;
                    if (conversationContext.rego || conversationContext.registration) {
                        contextInfo += `Registration: ${conversationContext.rego || conversationContext.registration}. `;
                    }
                    if (conversationContext.vehicle || conversationContext.model) {
                        contextInfo += `Vehicle: ${conversationContext.vehicle || conversationContext.model}. `;
                    }
                    
                    enrichedMessage = `${contextInfo}\n\n${message}`;
                }
                
                console.log('System override:', systemOverride);
                console.log('Enriched message:', enrichedMessage);
                
                // Prepare context with system override and brand
                const requestContext = {
                    ...conversationContext,
                    system_override: systemOverride,
                    brand: detectedBrand
                };
                
                // Send to real AI backend with conversation history support
                fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        network_name: selectedAgentForChat,
                        message: enrichedMessage,
                        session_id: currentSessionId,
                        context: requestContext
                    })
                })
                .then(response => response.json())
                .then(data => {
                    // Remove typing indicator
                    const typingMsg = document.getElementById(typingId);
                    if (typingMsg) typingMsg.remove();
                    
                    if (data.status === 'success') {
                        const agentName = data.data.agent || selectedAgentForChat;
                        const responseText = data.data.response;
                        
                        // Update model if available
                        if (data.data.model) {
                            const modelElement = document.querySelector('.chat-info .info-row:nth-child(3) .info-value');
                            if (modelElement) {
                                modelElement.textContent = data.data.model;
                            }
                        }
                        
                        // Update session ID from response if provided
                        if (data.data.session_id) {
                            currentSessionId = data.data.session_id;
                        }
                        
                        addChatMessage('agent', agentName, responseText);
                        highlightAgentActivity(selectedAgentForChat);
                    } else {
                        addChatMessage('system', 'System', 'Error: ' + (data.message || 'Unknown error'));
                    }
                })
                .catch(error => {
                    // Remove typing indicator
                    const typingMsg = document.getElementById(typingId);
                    if (typingMsg) typingMsg.remove();
                    
                    console.error('Chat error:', error);
                    addChatMessage('system', 'System', 'Connection error. Please try again.');
                });
            }
        }
        
        // Function to select which agent to chat with (called when clicking agent cards)
        function selectAgentForChat(agentId, agentName) {
            // Save current chat before switching
            if (selectedAgentForChat) {
                saveChatHistory();
            }
            
            // Switch to new agent
            selectedAgentForChat = agentId;
            
            // Reset session and context when switching agents (fresh conversation)
            currentSessionId = null;
            conversationContext = {};
            console.log(`Switched to ${agentName}, reset session and context`);
            
            // Update UI
            const connectedAgent = document.getElementById('connected-agent');
            if (connectedAgent) {
                connectedAgent.textContent = `Connected: ${agentName}`;
            }
            
            // Update chat title
            document.querySelector('.chat-title').textContent = `Chat - ${agentName}`;
            
            // Load this agent's chat history (or start fresh)
            loadChatHistory(agentId);
        }
